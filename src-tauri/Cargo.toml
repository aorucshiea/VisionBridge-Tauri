[package]
name = "vision-bridge"
version = "0.1.0"
description = "Vision Bridge — intelligent desktop translator"
authors = ["Vision Bridge Team"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[profile.release]
# The whole point of this port: a small binary. Optimise hard.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
